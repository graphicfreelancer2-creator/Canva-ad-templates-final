<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#050507;--s:#0d0d13;--s2:#14141d;--line:#25252f;--text:#f4f3fb;--mute:#9d9bb0;--lav:#c3bff6;--lav2:#9d96f2;--ok:#5be39a;--warn:#f5c04a;--bad:#ff6b7d;--g:linear-gradient(135deg,#7a3cf5,#2fa5ff);--d:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 50% -10%,rgba(122,60,245,.25),transparent),var(--bg);color:var(--text);font:400 15px/1.5 var(--d);min-height:100vh}
h1,h2{margin:0;letter-spacing:-.03em;font-weight:800}em{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-style:italic;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.wrap{max-width:1200px;margin:0 auto;padding:28px 20px 80px}
.btn{border:1px solid var(--line);background:var(--s2);color:var(--text);border-radius:99px;padding:10px 18px;font:600 14px var(--d);cursor:pointer}.btn:hover{border-color:var(--lav2)}
.btn.p{background:var(--lav);color:#0b0b14;border-color:var(--lav)}.btn.bad{color:var(--bad)}.btn.ok{color:#0b0b14;background:var(--ok);border-color:var(--ok)}.btn:disabled{opacity:.5;cursor:default}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}.top h1{font-size:clamp(26px,4vw,38px)}.top p{color:var(--mute);margin:4px 0 0}.tools{display:flex;gap:10px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.card{border:1px solid var(--line);border-radius:20px;padding:20px;background:linear-gradient(160deg,#17132c,var(--s))}
.card small{color:var(--mute);text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:600}.card b{display:block;font-size:28px;letter-spacing:-.03em;margin:8px 0 2px;font-weight:800}.card span{color:var(--mute);font-size:13px}
.panel{border:1px solid var(--line);border-radius:22px;background:var(--s);padding:22px;margin-top:20px}
.panel h2{font-size:20px;margin-bottom:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border:0}.tw{overflow-x:auto}.num{text-align:right}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:600}.st-approved{background:rgba(91,227,154,.14);color:var(--ok)}.st-pending{background:rgba(245,192,74,.14);color:var(--warn)}.st-cancelled{background:rgba(255,107,125,.14);color:var(--bad)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tab{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:99px;padding:8px 16px;font:500 14px var(--d);cursor:pointer}.tab.on{background:var(--lav);color:#0b0b14;border-color:var(--lav)}
input.q{background:var(--s2);border:1px solid var(--line);border-radius:99px;color:var(--text);padding:9px 16px;font:400 14px var(--d);min-width:220px}
a{color:var(--lav)}.mute{color:var(--mute)}.acts{display:flex;gap:6px;flex-wrap:wrap}.acts .btn{padding:6px 12px;font-size:13px}.meta-ok{color:var(--ok);font-size:13px}.meta-bad{color:var(--bad);font-size:13px}
#login{max-width:420px;margin:12vh auto 0;border:1px solid var(--line);border-radius:26px;padding:34px;background:linear-gradient(160deg,#17132c,var(--s))}
#login input{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--text);font:400 16px var(--d);margin-top:12px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}#modal.on{display:flex}
#modal .box{position:relative;max-width:min(900px,100%);max-height:100%;background:var(--s);border:1px solid var(--line);border-radius:18px;padding:14px;overflow:auto}#modal img{display:block;max-width:100%;max-height:80vh;border-radius:10px}
#modal .x{position:absolute;right:10px;top:10px}
.bars{display:flex;align-items:flex-end;gap:4px;height:180px;padding-top:10px}.bar{flex:1;background:var(--g);border-radius:6px 6px 0 0;min-height:2px;position:relative}.bar:hover{filter:brightness(1.25)}
.bl{display:flex;gap:4px;margin-top:6px;color:var(--mute);font-size:11px}.bl span{flex:1;text-align:center;overflow:hidden}
@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div id="login" style="display:none">
<h1>Admin <em>sign in</em></h1><p class="mute" style="margin:8px 0 0">Only the owner can access this page.</p>
<input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<div class="err" id="lerr"></div><button class="btn p" id="lbtn" style="width:100%;margin-top:6px;padding:14px">Sign in</button>
</div>

<div id="app" style="display:none">
<div class="top"><div><h1>Admin <em>dashboard</em></h1><p>Live earnings, orders and conversion analytics</p></div>
<div class="tools"><button class="btn" id="retry">Retry failed Meta events</button><button class="btn" id="refresh">Refresh</button><button class="btn" id="out">Sign out</button></div></div>

<div class="cards" id="c1"></div><div class="cards" id="c2"></div>

<div class="panel"><h2>Daily sales · last 30 days</h2><div class="bars" id="bars"></div><div class="bl" id="bl"></div></div>
<div class="two">
<div class="panel"><h2>Weekly sales</h2><div class="tw"><table id="wk"></table></div></div>
<div class="panel"><h2>Monthly sales</h2><div class="tw"><table id="mo"></table></div></div>
</div>

<div class="panel"><div class="top" style="margin-bottom:14px"><h2 style="margin:0">Order management</h2>
<div class="tabs" id="tabs"></div></div>
<input class="q" id="q" placeholder="Search name, email or phone" style="margin-bottom:14px;width:100%;max-width:340px">
<div class="tw"><table><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>WhatsApp</th><th class="num">Amount</th><th>Proof</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
<p style="text-align:center;margin-top:14px"><button class="btn" id="more" style="display:none">Load more</button></p>
</div>
</div>
</div>
<div id="modal"><div class="box"><button class="btn x" id="mx">Close</button><div id="mc"></div></div></div>

<script>
var C=window.CFG||{},TZ="Asia/Karachi",PRICE="PKR ";
function $(i){return document.getElementById(i)}
if(!C.SUPABASE_URL||!C.SUPABASE_ANON_KEY){document.body.innerHTML='<div class="wrap"><h1>Setup needed</h1><p class="mute">Fill SUPABASE_URL and SUPABASE_ANON_KEY in config.js.</p></div>'}
var sb=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY),session=null,orders=[],filter="all",shown=100,query="";
function money(n){return PRICE+Number(n||0).toLocaleString("en-US")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dkey(d){return new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(d))}
function wkey(k){var p=k.split("-"),d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10)}
function waLink(p){var d=String(p).replace(/\D/g,"");if(d.indexOf("00")===0)d=d.slice(2);if(d[0]==="0")d="92"+d.slice(1);return"https://wa.me/"+d}
function when(d){return new Date(d).toLocaleString("en-US",{timeZone:TZ,month:"2-digit",day:"2-digit",year:"numeric",hour:"numeric",minute:"2-digit"})}

async function boot(){var r=await sb.auth.getSession();session=r.data.session;if(session)enter();else{$("login").style.display="block";$("app").style.display="none"}}
$("lbtn").onclick=async function(){$("lerr").textContent="";var r=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
if(r.error){$("lerr").textContent="Wrong email or password.";return}session=r.data.session;enter()};
$("pw").onkeydown=function(e){if(e.key==="Enter")$("lbtn").click()};
$("out").onclick=async function(){await sb.auth.signOut();location.reload()};
function enter(){$("login").style.display="none";$("app").style.display="block";load();setInterval(load,30000)}

async function load(){
 var all=[],from=0,step=1000;
 for(;;){var r=await sb.from("orders").select("*").order("created_at",{ascending:false}).range(from,from+step-1);
  if(r.error){if(r.error.code==="PGRST301"||/JWT/i.test(r.error.message)){await sb.auth.signOut();location.reload()}alert("Could not load orders: "+r.error.message);return}
  all=all.concat(r.data);if(r.data.length<step)break;from+=step}
 orders=all;render()}

function render(){
 var ap=orders.filter(function(o){return o.status==="approved"}),pe=orders.filter(function(o){return o.status==="pending"}),ca=orders.filter(function(o){return o.status==="cancelled"});
 var today=dkey(new Date()),wk=wkey(today),mo=today.slice(0,7);
 function sum(a){return a.reduce(function(s,o){return s+o.amount},0)}
 function at(o){return o.approved_at||o.created_at}
 var tA=ap.filter(function(o){return dkey(at(o))===today}),wA=ap.filter(function(o){return wkey(dkey(at(o)))===wk}),mA=ap.filter(function(o){return dkey(at(o)).slice(0,7)===mo});
 var dec=ap.length+ca.length,conv=dec?Math.round(ap.length/dec*100):0;
 function card(t,v,s){return'<div class="card"><small>'+t+'</small><b>'+v+'</b><span>'+s+'</span></div>'}
 $("c1").innerHTML=card("Total earnings",money(sum(ap)),ap.length+" approved orders")+card("Today",money(sum(tA)),tA.length+" approved")+card("This week",money(sum(wA)),wA.length+" approved · from Monday")+card("This month",money(sum(mA)),mA.length+" approved · "+mo);
 $("c2").innerHTML=card("Approved",ap.length,"+"+money(sum(ap))+" earned")+card("Pending",pe.length,"Awaiting review")+card("Cancelled",ca.length,"-"+money(sum(ca))+" lost")+card("Conversion",conv+"%",ap.length+"/"+dec+" decided");
 document.title=(pe.length?"("+pe.length+") ":"")+"Admin Dashboard";
 // daily bars
 var days=[],map={};for(var i=29;i>=0;i--){var d=new Date(Date.now()-i*864e5),k=dkey(d);days.push(k);map[k]=0}
 ap.forEach(function(o){var k=dkey(at(o));if(k in map)map[k]+=o.amount});
 var mx=Math.max.apply(null,days.map(function(k){return map[k]}).concat([1]));
 $("bars").innerHTML=days.map(function(k){return'<div class="bar" style="height:'+Math.max(2,map[k]/mx*100)+'%" title="'+k+': '+money(map[k])+'"></div>'}).join("");
 $("bl").innerHTML=days.map(function(k,i){return'<span>'+(i%5===0?k.slice(5):"")+'</span>'}).join("");
 // weekly / monthly
 function group(keyf,n){var g={};ap.forEach(function(o){var k=keyf(dkey(at(o)));g[k]=g[k]||{n:0,v:0};g[k].n++;g[k].v+=o.amount});return Object.keys(g).sort().reverse().slice(0,n).map(function(k){return[k,g[k]]})}
 function tbl(rows,l){return'<thead><tr><th>'+l+'</th><th class="num">Orders</th><th class="num">Sales</th></tr></thead><tbody>'+(rows.map(function(r){return'<tr><td>'+r[0]+'</td><td class="num">'+r[1].n+'</td><td class="num">'+money(r[1].v)+'</td></tr>'}).join("")||'<tr><td colspan="3" class="mute">No sales yet</td></tr>')+'</tbody>'}
 $("wk").innerHTML=tbl(group(wkey,8),"Week starting");$("mo").innerHTML=tbl(group(function(k){return k.slice(0,7)},12),"Month");
 // tabs
 var tabs=[["all","All ("+orders.length+")"],["pending","Pending ("+pe.length+")"],["approved","Approved ("+ap.length+")"],["cancelled","Cancelled ("+ca.length+")"]];
 $("tabs").innerHTML=tabs.map(function(t){return'<button class="tab'+(filter===t[0]?" on":"")+'" data-f="'+t[0]+'">'+t[1]+'</button>'}).join("");
 [].forEach.call($("tabs").children,function(b){b.onclick=function(){filter=b.dataset.f;shown=100;render()}});
 // rows
 var list=orders.filter(function(o){return(filter==="all"||o.status===filter)&&(!query||(o.name+" "+o.email+" "+o.phone).toLowerCase().indexOf(query)>-1)});
 $("rows").innerHTML=list.slice(0,shown).map(function(o){
  var meta=o.status==="approved"?(o.meta_status==="sent"?'<div class="meta-ok">✓ Meta sent</div>':'<div class="meta-bad" title="'+esc(o.meta_error)+'">✕ Meta failed</div>'):"";
  var acts=[];
  if(o.status!=="approved")acts.push('<button class="btn ok" data-a="approve" data-id="'+o.id+'">Approve</button>');
  if(o.status!=="cancelled")acts.push('<button class="btn bad" data-a="cancel" data-id="'+o.id+'">Cancel</button>');
  if(o.status==="approved"&&o.meta_status!=="sent")acts.push('<button class="btn" data-a="retry" data-id="'+o.id+'">Retry Meta</button>');
  return'<tr><td class="mute" style="white-space:nowrap">'+when(o.created_at)+'</td><td><b>'+esc(o.name)+'</b></td><td class="mute">'+esc(o.email)+'</td><td><a href="'+waLink(o.phone)+'" target="_blank" rel="noopener">'+esc(o.phone)+'</a></td><td class="num" style="white-space:nowrap">'+money(o.amount)+'</td><td>'+(o.proof_path?'<a href="#" data-p="'+esc(o.proof_path)+'">View</a>':'<span class="mute">—</span>')+'</td><td><span class="pill st-'+o.status+'">'+o.status[0].toUpperCase()+o.status.slice(1)+'</span>'+meta+'</td><td><div class="acts">'+acts.join("")+'</div></td></tr>'}).join("")||'<tr><td colspan="8" class="mute" style="text-align:center;padding:30px">No orders found</td></tr>';
 $("more").style.display=list.length>shown?"inline-block":"none";
 [].forEach.call($("rows").querySelectorAll("[data-a]"),function(b){b.onclick=function(){act(b.dataset.a,b.dataset.id,b)}});
 [].forEach.call($("rows").querySelectorAll("[data-p]"),function(a){a.onclick=function(e){e.preventDefault();proof(a.dataset.p)}});
}
$("q").oninput=function(){query=this.value.trim().toLowerCase();shown=100;render()};
$("more").onclick=function(){shown+=100;render()};$("refresh").onclick=load;

async function call(body){var s=(await sb.auth.getSession()).data.session;if(!s){location.reload();return{}}
 var r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+s.access_token},body:JSON.stringify(body)});
 var j=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(j.error||"Request failed");return j}
async function act(a,id,btn){
 if(a==="approve"&&!confirm("Approve this order? A Purchase event will be sent to Meta."))return;
 if(a==="cancel"&&!confirm("Cancel this order?"))return;
 btn.disabled=true;try{var j=await call({action:a,id:id});if(a!=="cancel"&&j.order&&j.order.meta_status==="failed")alert("Approved, but Meta failed: "+j.order.meta_error)}catch(e){alert(e.message)}load()}
$("retry").onclick=async function(){this.disabled=true;try{var j=await call({action:"retry_all"});alert("Tried "+j.tried+" order(s), sent "+j.sent+".")}catch(e){alert(e.message)}this.disabled=false;load()};

async function proof(path){$("mc").innerHTML='<p class="mute" style="padding:20px">Loading…</p>';$("modal").classList.add("on");
 var r=await sb.storage.from("proofs").createSignedUrl(path,3600);if(r.error){$("mc").innerHTML='<p class="meta-bad" style="padding:20px">Could not load file.</p>';return}
 var u=r.data.signedUrl;$("mc").innerHTML=/\.pdf$/i.test(path)?'<p style="padding:20px"><a href="'+u+'" target="_blank" rel="noopener">Open PDF</a></p>':'<img src="'+u+'" alt="Payment screenshot"><p style="margin:10px 0 0"><a href="'+u+'" target="_blank" rel="noopener">Open full size</a></p>'}
$("mx").onclick=function(){$("modal").classList.remove("on")};$("modal").onclick=function(e){if(e.target===this)this.classList.remove("on")};
boot();
</script>
</body>
</html>
